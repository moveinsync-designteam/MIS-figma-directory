<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETS Figma Directory</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#070b0e;--surface:rgba(255,255,255,0.022);--border:rgba(255,255,255,0.07);
    --text:#e4e7e7;--text-dim:rgba(255,255,255,0.42);--text-muted:rgba(255,255,255,0.27);
    --accent:#2dd4bf;--accent-soft:rgba(45,212,191,0.12);--accent-border:rgba(45,212,191,0.3);
    --tag:#99f6e4;--fresh:#10b981;--recent:#60a5fa;--aging:#f59e0b;--stale:#ef4444;
  }
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);
       min-height:100vh;-webkit-font-smoothing:antialiased}

  .header{border-bottom:1px solid var(--border);padding:16px 22px;display:flex;align-items:center;
          justify-content:space-between;gap:14px;flex-wrap:wrap}
  .hl{display:flex;align-items:center;gap:10px}
  .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2dd4bf,#0d9488);
        display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#04201c}
  .header h1{font-size:16px;font-weight:600;letter-spacing:-0.02em}
  .org{font-size:12px;color:var(--text-dim)}
  .meta{font-size:11px;color:var(--text-muted)}
  .lnk{font-size:11px;color:var(--text-dim);text-decoration:none;border:1px solid var(--border);
       padding:5px 10px;border-radius:6px}
  .lnk:hover{color:var(--text);border-color:var(--accent-border)}
  /* .lnk was written for <a>; a <button> needs these or it falls back to the
     browser's own grey face and system font */
  button.lnk{font-family:inherit;cursor:pointer;line-height:1.55;
             -webkit-appearance:none;appearance:none}
  /* The access link is the one control people must be able to find. It gets the
     accent, not the muted treatment the navigation links use. */
  #cpl{color:#5eead4;background:rgba(45,212,191,0.15);border-color:rgba(45,212,191,0.5);font-weight:500}
  #cpl:hover{color:#0a0a0a;background:var(--accent);border-color:var(--accent)}

  .shell{display:flex;align-items:flex-start}
  .col{flex:1;min-width:0}
  .controls{padding:15px 22px 9px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .sw{position:relative;flex:1 1 300px;min-width:200px}
  .sw input{width:100%;padding:11px 12px 11px 35px;background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.09);border-radius:9px;color:var(--text);font-size:14px;outline:none}
  .sw input:focus{border-color:var(--accent-border)}
  .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:0.35}
  .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text-muted);
       border:1px solid var(--border);border-radius:4px;padding:2px 5px}
  select{padding:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);
         border-radius:8px;color:var(--text);font-size:12px;outline:none;max-width:190px}
  select option{background:#11201f}
  .stats{padding:0 22px 11px;font-size:11px;color:var(--text-muted);display:flex;gap:14px;flex-wrap:wrap}
  .dotk{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}

  .list{padding:0 22px 48px;display:flex;flex-direction:column;gap:3px}
  .card{background:var(--surface);border:1px solid transparent;border-radius:9px;padding:12px 14px}
  .card:hover{background:rgba(45,212,191,0.045)}
  .card.sel{border-color:var(--accent-border);background:var(--accent-soft)}
  .ctop{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:start}
  .fname{font-size:14px;font-weight:600;color:#f0fdfa;text-decoration:none;letter-spacing:-0.01em;
         display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  .fname:hover{color:var(--accent);text-decoration:underline}
  .fsub{font-size:11px;color:var(--text-muted);margin-top:3px}
  .tag{display:inline-block;padding:3px 8px;background:var(--accent-soft);border:1px solid var(--accent-border);
       border-radius:5px;font-size:10.5px;color:var(--tag);white-space:nowrap}
  .time{font-size:11.5px;color:rgba(255,255,255,0.38);white-space:nowrap;padding-top:2px}
  .sdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-top:5px}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .chip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;max-width:100%;padding:5px 10px;border-radius:6px;
        background:rgba(255,255,255,0.045);border:1px solid var(--border);cursor:pointer;
        font-family:inherit;font-size:12px;color:var(--text);text-align:left;line-height:1.35}
  .chip:hover{border-color:var(--accent-border);background:var(--accent-soft)}
  .chip.on{border-color:var(--accent);background:var(--accent-soft);color:#ccfbf1}
  .chip b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:460px}
  .chip mark{background:rgba(45,212,191,0.26);color:#ccfbf1;border-radius:2px;padding:0 1px}
  .chip i{font-style:normal;font-size:10.5px;color:var(--text-muted);white-space:nowrap}
  .ic{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:0 0 22px;
      border-radius:5px;border:1px solid transparent;background:none;color:var(--text-muted);
      cursor:pointer;padding:0;font-family:inherit;text-decoration:none;vertical-align:middle}
  .ic:hover{color:var(--accent);border-color:var(--accent-border);background:var(--accent-soft)}
  .ic svg{display:block}
  .fic{margin-left:4px}
  .tixw{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
  .tixh{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:6px}
  .tixc{display:flex;flex-wrap:wrap;gap:6px}
  .tchip{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:4px 9px;border-radius:6px;
         border:1px solid var(--border);background:rgba(96,165,250,0.06);font-size:11.5px;
         color:var(--text-dim);text-decoration:none;line-height:1.5}
  .tchip:hover{border-color:rgba(96,165,250,0.45);background:rgba(96,165,250,0.15);color:#dbeafe}
  .tchip b{font-weight:600;color:#93c5fd;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .tchip u{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:430px}
  .tchip mark{background:rgba(96,165,250,0.3);color:#dbeafe;border-radius:2px;padding:0 1px}
  .tdot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
  .tcount{color:#93c5fd;cursor:pointer;border-bottom:1px dotted rgba(147,197,253,0.4)}
  .more{background:none;border:none;color:var(--text-dim);font-size:11px;cursor:pointer;
        font-family:inherit;padding:5px 4px;text-decoration:underline}
  .more:hover{color:var(--accent)}
  .weakbar{margin-top:10px;padding:11px;border-radius:9px;border:1px dashed var(--border);
           background:none;color:var(--text-dim);font-family:inherit;font-size:12px;cursor:pointer}
  .weakbar:hover{color:var(--text);border-color:var(--accent-border)}
  .weakhead{margin:16px 0 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
  .card.weak{opacity:.52}
  .card.weak:hover{opacity:.9}
  .weakish{color:var(--text-muted);font-style:italic}
  .none{padding:46px 0;text-align:center;color:var(--text-muted);font-size:13px}

  /* right panel */
  .panel{flex:0 0 470px;max-width:470px;position:sticky;top:12px;height:calc(100vh - 86px);
         margin:15px 18px 0 0;border:1px solid var(--accent-border);border-radius:12px;
         background:#0b1114;display:none;flex-direction:column;overflow:hidden}
  .panel.on{display:flex}
  .ph{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
  .pt{font-size:13.5px;font-weight:600;color:#f0fdfa;line-height:1.35}
  .pc{font-size:10.5px;color:var(--text-muted);margin-top:3px;line-height:1.5}
  .px{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:17px;line-height:1;
      padding:0 2px;font-family:inherit}
  .px:hover{color:var(--text)}
  .pb{flex:1;position:relative;background:#0e1518;min-height:0}
  .pb iframe{width:100%;height:100%;border:0;display:block}
  .pmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
        padding:26px;font-size:11.5px;color:var(--text-muted);line-height:1.65}
  .pa{display:flex;gap:7px;padding:10px 14px;border-top:1px solid var(--border);flex-wrap:wrap}
  .pbtn{font-size:11.5px;padding:7px 12px;border-radius:7px;border:1px solid var(--border);
        background:rgba(255,255,255,0.04);color:var(--text-dim);cursor:pointer;font-family:inherit;
        text-decoration:none;white-space:nowrap}
  .pbtn:hover{color:var(--tag);border-color:var(--accent-border);background:var(--accent-soft)}
  .pbtn.main{color:var(--tag);border-color:var(--accent-border);background:var(--accent-soft)}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);background:#0f2b28;
         border:1px solid var(--accent-border);color:var(--tag);font-size:12px;padding:9px 16px;border-radius:8px;
         transition:transform .2s;pointer-events:none;z-index:60}
  .toast.on{transform:translateX(-50%) translateY(0)}

  @media(max-width:1180px){
    .panel{position:fixed;inset:auto 12px 12px auto;width:430px;height:66vh;margin:0;z-index:40;
           box-shadow:0 20px 60px rgba(0,0,0,.65)}
  }
  @media(max-width:760px){
    .ctop{grid-template-columns:minmax(0,1fr) auto}
    .ctop>.time,.ctop>.sdot{display:none}
    .panel{left:12px;width:auto}
    .kbd{display:none}
  }
</style>
</head>
<body>

<div class="header">
  <div class="hl">
    <div class="logo">ETS</div>
    <h1>ETS Figma Directory</h1>
    <span class="org">MoveInSync</span>
  </div>
  <div class="hl">
    <span class="meta" id="metaInfo"></span>
    <button class="lnk" id="cpl" type="button" title="Copy the link that includes the access key">Copy access link</button>
    <a class="lnk" href="../WIS/">WorkInSync &rarr;</a>
    <a class="lnk" href="../">All directories</a>
  </div>
</div>

<div class="shell">
  <div class="col">
    <div class="controls" id="controls"></div>
    <div class="stats" id="stats"></div>
    <div class="list" id="list"></div>
  </div>
  <aside class="panel" id="panel">
    <div class="ph">
      <div style="flex:1;min-width:0"><div class="pt" id="pt"></div><div class="pc" id="pc"></div></div>
      <button class="px" id="px" title="Close">&times;</button>
    </div>
    <div class="pb" id="pb"></div>
    <div class="pa" id="pa"></div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const STALE = {fresh:"#10b981",recent:"#60a5fa",aging:"#f59e0b",stale:"#ef4444"};
const EMBED_HOST = "mis-figma-directory";
const CHIP_LIMIT = 12;

const EYE = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" ' +
  'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M1.2 8S3.7 3.6 8 3.6 14.8 8 14.8 8 12.3 12.4 8 12.4 1.2 8 1.2 8z"/><circle cx="8" cy="8" r="1.9"/></svg>';
const EXT = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" ' +
  'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M9.5 2.2H13.8V6.5"/><path d="M13.8 2.2 7.4 8.6"/>' +
  '<path d="M11.6 9.4v3.5a1 1 0 0 1-1 1h-7.4a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1h3.5"/></svg>';

const state = { files: [], q: "", module: "All", project: "All",
                sort: "lastModified-desc", expanded: {}, tixOpen: {}, sel: null,
                rows: [], showWeak: false, jira: false, jiraCount: 0 };

// Jira statuses collapse to four buckets for the dot on each ticket chip.
const TSTAT = {
  "done":"#10b981","done ":"#10b981","closed":"#10b981","ready for release":"#10b981",
  "dev complete":"#34d399","waiting for qa":"#f59e0b","in qa review":"#f59e0b",
  "in development":"#f59e0b","in progress":"#f59e0b",
  "open":"#64748b","to do":"#64748b","ready for development":"#64748b",
  "rejected":"#ef4444","cancelled":"#ef4444"
};
const tcol = s => TSTAT[String(s||"").trim().toLowerCase()] || "#64748b";

/* ---------- access key ---------- */

// The published blobs are encrypted. The key travels in the "#k=" part of the
// link, which browsers never send to a server, and is kept in this browser
// afterwards so the plain address keeps working. Stripping it from the address
// bar keeps it out of screenshots.
const KEY_STORE = "figdir.key";

function keyFromUrl() {
  const m = /[#&]k=([A-Za-z0-9_\-+/=]+)/.exec(location.hash || "");
  return m ? m[1] : null;
}
function storedKey() {
  try { return localStorage.getItem(KEY_STORE); } catch (e) { return null; }
}
function accessKey() { return keyFromUrl() || storedKey(); }

function keyBytes(s) {
  s = String(s).replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bin = atob(s), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}

async function gunzipJSON(u8) {
  if (typeof DecompressionStream !== "function")
    throw new Error("This browser is too old to read the index. Use a current Chrome, Edge, Firefox or Safari.");
  const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}

// Plain gzip starts 1f 8b; a sealed blob starts with the ASCII marker FDE1.
async function openBlob(buf) {
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0x1f && u8[1] === 0x8b) return gunzipJSON(u8);
  if (!(u8[0] === 70 && u8[1] === 68 && u8[2] === 69 && u8[3] === 49))
    throw new Error("That file is not a directory index.");
  const raw = accessKey();
  if (!raw) throw Object.assign(new Error("no access key"), { code: "nokey" });
  let plain;
  try {
    const key = await crypto.subtle.importKey("raw", keyBytes(raw), "AES-GCM", false, ["decrypt"]);
    plain = new Uint8Array(await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: u8.slice(4, 16) }, key, u8.slice(16)));
  } catch (e) {
    throw Object.assign(new Error("wrong access key"), { code: "badkey" });
  }
  try { localStorage.setItem(KEY_STORE, raw); } catch (e) {}
  if (keyFromUrl() && history.replaceState)
    history.replaceState(null, "", location.pathname + location.search);
  return gunzipJSON(plain);
}

function shareLink() {
  const k = accessKey();
  return location.origin + location.pathname + (k ? "#k=" + k : "");
}

/* ---------- load ---------- */

// The index ships as a gzipped blob rather than readable JSON: it keeps the file
// out of search-engine results and out of casual view in the repo.
async function fetchIndex() {
  const bust = "?v=" + Date.now();
  let res = await fetch("figma-directory-data.bin" + bust);
  if (res.ok) return openBlob(await res.arrayBuffer());
  res = await fetch("figma-directory-data.json" + bust);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

// The Jira cross-reference is a second, optional blob. It is fetched after the
// directory has already painted, so a missing or failed file costs nothing.
async function fetchBlob(stem) {
  const bust = "?v=" + Date.now();
  let res = await fetch(stem + ".bin" + bust);
  if (res.ok) return openBlob(await res.arrayBuffer());
  res = await fetch(stem + ".json" + bust);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

async function loadJira() {
  let d;
  try { d = await fetchBlob("jira-index"); }
  catch (e) { return; }                       // no cross-reference published: carry on
  const byKey = d && d.files;
  if (!byKey) return;
  const base = d.base || "";
  let n = 0;
  const seen = {};
  for (const f of state.files) {
    const rec = byKey[f.id];
    const tx = (rec && rec.tickets) || [];
    for (const t of tx) if (!t.u && base) t.u = base + t.k;
    f._tx = tx;
    f._ts = tx.map(t => (t.k || "") + " " + (t.t || "") + " " + (t.s || "")).join(" \u00b7 ").toLowerCase();
    for (const t of tx) if (!seen[t.k]) { seen[t.k] = 1; n++; }
  }
  state.jira = true;
  state.jiraCount = n;
  const mi = document.getElementById("metaInfo");
  if (mi && mi.textContent.indexOf("Jira") === -1)
    mi.textContent += " \u00b7 " + n.toLocaleString() + " Jira tickets";
  renderList();
}

async function load() {
  try {
    state.files = await fetchIndex();
  } catch (e) {
    if (e && e.code === "nokey")
      return fail("Access link needed", "This directory is private. Open it with the access link your team shares — the one ending in <code>#k=…</code>. Paste the whole thing, including everything after the #.");
    if (e && e.code === "badkey") {
      try { localStorage.removeItem(KEY_STORE); } catch (x) {}
      return fail("That link no longer works", "That access key does not open this directory. It may have been rotated — ask whoever shares the link for the current one.");
    }
    return fail("Could not load the index",
      "<code>figma-directory-data.bin</code> must sit next to this page. If the directory has not been " +
      "indexed yet, run the <b>Refresh Figma index</b> workflow in the repo's Actions tab." +
      "<br><br><span style='opacity:.6'>" + esc(e.message) + "</span>");
  }
  if (!Array.isArray(state.files) || !state.files.length)
    return fail("Nothing indexed yet",
      "Add Figma folder links to <code>ets/figma-directory-config.json</code> and commit.");

  for (const f of state.files) {
    f._pn = {};
    for (const p of (f.pagesData || [])) f._pn[p.id] = p.name;
    // every word found inside the designs, for the weaker "text somewhere in this file" tier
    f._wt = " " + (f.words || []).join(" ") + " ";
  }
  render();
  loadJira();
}

function fail(title, body) {
  document.getElementById("list").innerHTML =
    '<div class="none" style="padding:70px 20px"><div style="font-size:15px;color:rgba(255,255,255,.6);margin-bottom:9px">' +
    title + '</div><div style="max-width:470px;margin:0 auto;line-height:1.65">' + body + '</div></div>';
}

/* ---------- helpers ---------- */

function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function terms(q){return (q||"").toLowerCase().split(/\s+/).filter(Boolean);}
function hasAll(h,ts){const s=(h||"").toLowerCase();return ts.every(t=>s.includes(t));}

function mark(text, ts) {
  let out = esc(text);
  for (const t of ts) {
    const safe = t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    out = out.replace(new RegExp("(" + safe + ")(?![^<]*>)", "ig"), "<mark>$1</mark>");
  }
  return out;
}

function figmaUrl(fileId, nodeId, dev) {
  let u = "https://www.figma.com/design/" + fileId;
  if (nodeId) u += "?node-id=" + String(nodeId).replace(/:/g, "-");
  if (dev) u += (nodeId ? "&" : "?") + "m=dev";
  return u;
}

function timeAgo(d){
  if(!d) return "Unknown";
  const dt=new Date(d); if(isNaN(dt)) return d;
  const n=Math.floor((Date.now()-dt)/86400000);
  if(n<0) return "Future"; if(n===0) return "Today"; if(n===1) return "Yesterday";
  if(n<7) return n+"d ago"; if(n<30) return Math.floor(n/7)+"w ago";
  if(n<365) return Math.floor(n/30)+"mo ago"; return Math.floor(n/365)+"y ago";
}
function staleness(d){
  if(!d) return "stale";
  const dt=new Date(d); if(isNaN(dt)) return "stale";
  const n=Math.floor((Date.now()-dt)/86400000);
  if(n<30) return "fresh"; if(n<90) return "recent"; if(n<180) return "aging"; return "stale";
}

let toastT;
function toast(m){
  const el=document.getElementById("toast");
  el.textContent=m; el.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),1600);
}

/* ---------- filtering: files first, matching screens clustered under each ---------- */

function build() {
  const ts = terms(state.q);
  const out = [];
  for (const f of state.files) {
    if (state.module !== "All" && f.module !== state.module) continue;
    if (state.project !== "All" && f.projectName !== state.project) continue;

    let hits = [], tix = [], tier = 0;
    if (ts.length) {
      hits = (f.labels || []).filter(l => hasAll(l.t + " " + (f._pn[l.p] || ""), ts));
      // a page whose own name matches is worth showing even with no heading inside it
      if (!hits.length) {
        hits = (f.pagesData || []).filter(pg => hasAll(pg.name, ts))
                 .map(pg => ({ t: pg.name, id: pg.id, p: pg.id, _page: true }));
      }
      // Jira: a ticket whose key, title or status carries the words. The cheap
      // joined string is checked first so most files cost one indexOf.
      if (state.jira && f._ts && hasAll(f._ts, ts))
        tix = (f._tx || []).filter(t => hasAll((t.k||"") + " " + (t.t||"") + " " + (t.s||""), ts));
      const tagHit = hasAll((f.name||"") + " " + (f.module||"") + " " + (f.projectName||""), ts);
      if (!hits.length) {
        // screens, then the file's own name, then tickets, then loose text
        if (tagHit) tier = 1;
        else if (tix.length) tier = 2;
        else {
          const textHit = ts.every(t => f.searchText.includes(t) || f._wt.includes(t));
          if (!textHit) continue;
          out.push({ f, hits: [], tix: [], tier: 3, weak: true });
          continue;
        }
      }
    }
    out.push({ f, hits, tix, tier });
  }

  const [by, dir] = state.sort.split("-");
  out.sort((a, b) => {
    // files that actually contain a match come first, whatever the sort
    if (ts.length) {
      if (a.tier !== b.tier) return a.tier - b.tier;   // screens, name/tag, tickets, text
    }
    let c = 0;
    if (by === "matches") c = a.hits.length - b.hits.length;
    else if (by === "lastModified") c = new Date(a.f.lastModified||0) - new Date(b.f.lastModified||0);
    else if (by === "name") c = (a.f.name||"").localeCompare(b.f.name||"");
    else if (by === "module") c = (a.f.module||"").localeCompare(b.f.module||"");
    return dir === "desc" ? -c : c;
  });
  return out;
}

/* ---------- render ---------- */

function render() {
  const mods = [...new Set(state.files.map(f=>f.module).filter(Boolean))].sort();
  const projs = [...new Set(state.files.map(f=>f.projectName).filter(Boolean))].sort();

  let h = '<div class="sw"><span class="si">&#128269;</span>' +
    '<input id="q" type="text" autocomplete="off" spellcheck="false" ' +
    'placeholder="Search screens, pages, files, Jira tickets…" value="' + esc(state.q) + '">' +
    '<span class="kbd">⌘K</span></div>';
  h += '<select id="mod"><option value="All">All modules</option>' +
    mods.map(m=>'<option value="'+esc(m)+'"'+(state.module===m?' selected':'')+'>'+esc(m)+'</option>').join('') + '</select>';
  h += '<select id="proj"><option value="All">All projects</option>' +
    projs.map(p=>'<option value="'+esc(p)+'"'+(state.project===p?' selected':'')+'>'+esc(p)+'</option>').join('') + '</select>';
  h += '<select id="sort">' + [["lastModified-desc","Latest first"],["lastModified-asc","Oldest first"],
    ["name-asc","Name A→Z"],["matches-desc","Most matches"],["module-asc","Module A→Z"]]
    .map(([v,l])=>'<option value="'+v+'"'+(state.sort===v?' selected':'')+'>'+l+'</option>').join('') + '</select>';

  document.getElementById("controls").innerHTML = h;
  document.getElementById("metaInfo").textContent =
    state.files.length + " files · " +
    state.files.reduce((n,f)=>n+(f.labels||[]).length,0).toLocaleString() + " screens";

  const q = document.getElementById("q");
  q.addEventListener("input", e => { state.q = e.target.value; state.expanded = {}; state.tixOpen = {}; state.showWeak = false; renderList(); });
  document.getElementById("mod").addEventListener("change", e => { state.module = e.target.value; renderList(); });
  document.getElementById("proj").addEventListener("change", e => { state.project = e.target.value; renderList(); });
  document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; renderList(); });

  renderList();
  q.focus();
}

function renderList() {
  const all = build();
  state.rows = all;
  const ts = terms(state.q);
  const weakCount = all.filter(r => r.weak).length;
  // the text-only tier is kept out of the way unless asked for: a common word can
  // appear in almost every file and would bury the real matches
  const rows = (ts.length && !state.showWeak) ? all.filter(r => !r.weak) : all;
  const totalHits = rows.reduce((n,r)=>n+r.hits.length,0);
  const totalTix  = rows.reduce((n,r)=>n+(r.tix?r.tix.length:0),0);

  document.getElementById("stats").innerHTML = ts.length
    ? '<span>' + rows.length + ' file' + (rows.length===1?'':'s') + ' · ' +
      totalHits.toLocaleString() + ' matching screen' + (totalHits===1?'':'s') +
      (totalTix ? ' · ' + totalTix.toLocaleString() + ' matching ticket' + (totalTix===1?'':'s') : '') +
      (weakCount ? ' · ' + weakCount + ' more mention it in their text' : '') + '</span>' +
      '<span>Eye = preview in the panel · arrow = open in a new tab</span>'
    : '<span>' + rows.length + ' of ' + state.files.length + ' files</span>' +
      '<span><span class="dotk" style="background:var(--fresh)"></span>Fresh &lt;30d</span>' +
      '<span><span class="dotk" style="background:var(--recent)"></span>1–3mo</span>' +
      '<span><span class="dotk" style="background:var(--aging)"></span>3–6mo</span>' +
      '<span><span class="dotk" style="background:var(--stale)"></span>6mo+</span>';

  const list = document.getElementById("list");
  if (!rows.length) { list.innerHTML = '<div class="none">Nothing matches. Try fewer words.</div>'; return; }

  let h = "";
  const weakStart = rows.findIndex(r => r.weak);
  rows.forEach((r, fi) => {
    if (fi === weakStart && weakStart !== -1 && state.showWeak)
      h += '<div class="weakhead">Text found inside these files, but nothing is named for it</div>';
    const f = r.f;
    const sel = state.sel && state.sel.fi === fi;
    const link = (f.link || figmaUrl(f.id)).split("?")[0];
    h += '<div class="card' + (sel ? ' sel' : '') + (r.weak ? ' weak' : '') + '" data-f="' + fi + '">';
    h += '<div class="ctop"><div style="min-width:0">' +
           '<a class="fname" href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(f.name) + '</a>' +
           '<button class="ic fic" data-pv="1" data-f="' + fi + '" data-l="0" ' +
             'title="Preview this file" aria-label="Preview">' + EYE + '</button>' +
           '<a class="ic fic" href="' + esc(link) + '" target="_blank" rel="noopener" ' +
             'title="Open the file in a new tab" aria-label="Open in new tab">' + EXT + '</a>' +
           '<div class="fsub">' + esc(f.projectName || "Untagged") + ' · ' +
             (f.pages||[]).length + ' pages · ' + (f.labels||[]).length + ' screens' +
             (r.hits.length ? ' · <span style="color:var(--tag)">' + r.hits.length + ' matching</span>' : '') +
             (state.jira ? ' · ' + ((f._tx||[]).length
                ? '<span class="tcount" data-tix="' + fi + '">' + (f._tx||[]).length +
                  ' ticket' + ((f._tx||[]).length===1?'':'s') + '</span>'
                : '<span style="color:var(--text-muted)">no tickets</span>') : '') +
             (r.weak ? ' · <span class="weakish">text inside this file</span>' : '') +
           '</div></div>';
    h += '<span class="tag">' + esc(f.module || "Other") + '</span>';
    h += '<span class="time">' + timeAgo(f.lastModified) + '</span>';
    h += '<span class="sdot" style="background:' + STALE[staleness(f.lastModified)] + '"></span></div>';

    if (r.hits.length) {
      const open = state.expanded[fi];
      const show = open ? r.hits : r.hits.slice(0, CHIP_LIMIT);
      h += '<div class="chips">';
      show.forEach((l, li) => {
        const idx = r.hits.indexOf(l);
        const on = sel && state.sel.li === idx;
        const page = f._pn[l.p] || "";
        const url = figmaUrl(f.id, l.id, false);
        h += '<span class="chip' + (on ? ' on' : '') + '" data-f="' + fi + '" data-l="' + idx + '">' +
               '<b>' + mark(l.t, ts) + '</b>' +
               (page ? '<i>· ' + esc(page) + '</i>' : '') +
               '<button class="ic" data-pv="1" data-f="' + fi + '" data-l="' + idx + '" ' +
                 'title="Preview in the panel" aria-label="Preview">' + EYE + '</button>' +
               '<a class="ic" href="' + esc(url) + '" target="_blank" rel="noopener" ' +
                 'title="Open this screen in a new tab" aria-label="Open in new tab">' + EXT + '</a>' +
             '</span>';
      });
      if (r.hits.length > CHIP_LIMIT)
        h += '<button class="more" data-more="' + fi + '">' +
             (open ? "show fewer" : "+" + (r.hits.length - CHIP_LIMIT) + " more") + '</button>';
      h += '</div>';
    }

    // Jira tickets: the ones that match the search, or the whole list once the
    // ticket count in the subtitle is clicked.
    const txAll = f._tx || [];
    const txOpen = !!state.tixOpen[fi];
    const txMatch = (r.tix || []).length > 0;
    const txSrc = txMatch ? r.tix : (txOpen ? txAll : []);
    const txShow = (txOpen || txSrc.length <= CHIP_LIMIT) ? txSrc : txSrc.slice(0, CHIP_LIMIT);
    if (txShow.length) {
      h += '<div class="tixw"><div class="tixh">' +
           (txMatch ? r.tix.length + ' matching ticket' + (r.tix.length===1?'':'s')
                    : txAll.length + ' Jira ticket' + (txAll.length===1?'':'s') + ' against this file') +
           '</div><div class="tixc">';
      txShow.forEach(t => {
        h += '<a class="tchip" href="' + esc(t.u || "") + '" target="_blank" rel="noopener" ' +
               'title="' + esc(t.s || "") + '">' +
               '<span class="tdot" style="background:' + tcol(t.s) + '"></span>' +
               '<b>' + mark(t.k || "", ts) + '</b>' +
               '<u>' + mark(t.t || "", ts) + '</u></a>';
      });
      h += '</div>';
      if (txSrc.length > txShow.length)
        h += '<button class="more" data-tix="' + fi + '">+' +
             (txSrc.length - txShow.length) + ' more</button>';
      else if (txOpen)
        h += '<button class="more" data-tix="' + fi + '">show fewer</button>';
      h += '</div>';
    }
    h += '</div>';
  });
  if (ts.length && weakCount && !state.showWeak)
    h += '<button class="weakbar" id="weakbar">' + weakCount +
         ' more file' + (weakCount===1?'':'s') + ' contain this text somewhere \u2014 show</button>';
  list.innerHTML = h;
  const wb = document.getElementById("weakbar");
  if (wb) wb.addEventListener("click", () => { state.showWeak = true; renderList(); });
}

/* ---------- preview panel ---------- */

function closePanel() {
  document.getElementById("panel").classList.remove("on");
  document.getElementById("pb").innerHTML = "";
  state.sel = null;
  renderList();
}

function openPanel(fi, li) {
  const r = state.rows[fi];
  if (!r) return;
  const f = r.f;
  const l = r.hits[li] || (f.labels || [])[0];
  if (!l) { toast("No screens indexed in this file"); return; }

  state.sel = { fi, li: r.hits[li] ? li : -1 };
  renderList();

  const panel = document.getElementById("panel");
  panel.classList.add("on");
  document.getElementById("pt").textContent = l.t;
  document.getElementById("pc").innerHTML =
    esc(f.name) + (f._pn[l.p] ? " · " + esc(f._pn[l.p]) : "") + (l.cn ? " · " + esc(l.cn) : "");

  // Preview the section the heading titles, else its page. The heading node itself
  // is a few words of text and shows nothing useful.
  const target = l.c || l.p || l.id;
  const body = document.getElementById("pb");
  body.innerHTML = '<div class="pmsg">Loading from Figma…</div>';
  const ifr = document.createElement("iframe");
  ifr.allowFullscreen = true;
  ifr.referrerPolicy = "no-referrer-when-downgrade";
  ifr.src = "https://embed.figma.com/design/" + f.id +
            "?node-id=" + String(target).replace(/:/g, "-") +
            "&embed-host=" + EMBED_HOST + "&theme=dark&footer=false&page-selector=false";
  ifr.addEventListener("load", () => { const m = body.querySelector(".pmsg"); if (m) m.remove(); });
  body.appendChild(ifr);

  const exact = figmaUrl(f.id, l.id, false);
  document.getElementById("pa").innerHTML =
    '<a class="pbtn main" href="' + esc(exact) + '" target="_blank" rel="noopener">Open this screen</a>' +
    '<a class="pbtn" href="' + esc(figmaUrl(f.id, l.id, true)) + '" target="_blank" rel="noopener">Dev Mode</a>' +
    '<a class="pbtn" href="' + esc((f.link || figmaUrl(f.id)).split("?")[0]) + '" target="_blank" rel="noopener">Go to file</a>' +
    '<button class="pbtn" id="cp">Copy link</button>';
  document.getElementById("cp").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(exact); toast("Link copied"); }
    catch { window.prompt("Copy this link:", exact); }
  });
}

/* ---------- interaction ---------- */

document.addEventListener("click", e => {
  const more = e.target.closest("[data-more]");
  if (more) { const fi = more.dataset.more; state.expanded[fi] = !state.expanded[fi]; renderList(); return; }

  const tx = e.target.closest("[data-tix]");
  if (tx) { e.preventDefault(); const fi = tx.dataset.tix;
            state.tixOpen[fi] = !state.tixOpen[fi]; renderList(); return; }

  const pv = e.target.closest("[data-pv]");
  if (pv) { e.preventDefault(); openPanel(Number(pv.dataset.f), Number(pv.dataset.l)); return; }

  if (e.target.closest("#px")) { closePanel(); return; }
  if (e.target.closest("a")) return;            // any link opens in its own tab
  if (e.target.closest(".panel")) return;

  const chip = e.target.closest(".chip");
  if (chip) { openPanel(Number(chip.dataset.f), Number(chip.dataset.l)); return; }

  const card = e.target.closest(".card");
  if (card) openPanel(Number(card.dataset.f), 0);
});

document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    const q = document.getElementById("q");
    if (q) { q.focus(); q.select(); }
    return;
  }
  if (e.key === "Escape") {
    if (document.getElementById("panel").classList.contains("on")) { closePanel(); return; }
    const q = document.getElementById("q");
    if (q && q.value) { q.value = ""; state.q = ""; renderList(); }
  }
});

const cpl = accessKey() ? document.getElementById("cpl") : null;
if (!accessKey()) { const b = document.getElementById("cpl"); if (b) b.style.display = "none"; }
if (cpl) cpl.addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(shareLink()); toast("Access link copied"); }
  catch (e) { toast(shareLink()); }
});

load();
</script>
</body>
</html>
