<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETS Figma Directory</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#070b0e;--surface:rgba(255,255,255,0.02);--surface-hover:rgba(45,212,191,0.07);
    --border:rgba(255,255,255,0.06);--text:#e4e7e7;--text-dim:rgba(255,255,255,0.38);
    --text-muted:rgba(255,255,255,0.26);--accent:#2dd4bf;--accent-soft:rgba(45,212,191,0.14);
    --accent-border:rgba(45,212,191,0.28);--tag-text:#99f6e4;
    --fresh:#10b981;--recent:#60a5fa;--aging:#f59e0b;--stale:#ef4444;
  }
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

  .header{border-bottom:1px solid var(--border);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .header-left{display:flex;align-items:center;gap:10px}
  .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#2dd4bf,#0d9488);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#04201c;letter-spacing:-0.03em}
  .header h1{font-size:17px;font-weight:600;letter-spacing:-0.02em}
  .header .org{font-size:12px;color:var(--text-dim)}
  .meta{font-size:11px;color:var(--text-muted)}
  .switch{font-size:11px;color:var(--text-dim);text-decoration:none;border:1px solid var(--border);padding:5px 10px;border-radius:6px}
  .switch:hover{color:var(--text);border-color:var(--accent-border)}

  .controls{padding:16px 24px 10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .search-wrap{position:relative;flex:1 1 320px;min-width:220px}
  .search-wrap input{width:100%;padding:11px 12px 11px 36px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:9px;color:var(--text);font-size:14px;outline:none}
  .search-wrap input:focus{border-color:var(--accent-border);background:rgba(255,255,255,0.05)}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:0.35}
  .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text-muted);border:1px solid var(--border);border-radius:4px;padding:2px 5px}
  select{padding:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:8px;color:var(--text);font-size:12px;outline:none}
  select option{background:#11201f}

  .modes{display:flex;gap:2px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:2px}
  .mode{padding:7px 13px;font-size:12px;color:var(--text-dim);background:none;border:none;border-radius:6px;cursor:pointer;font-family:inherit}
  .mode[aria-selected="true"]{background:var(--accent-soft);color:var(--tag-text)}

  .stats{padding:0 24px 12px;display:flex;gap:16px;font-size:11px;color:var(--text-muted);flex-wrap:wrap;align-items:center}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}

  .list{padding:0 24px 40px;display:flex;flex-direction:column;gap:2px}

  /* screen rows */
  .screen{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:14px;align-items:center;padding:11px 14px;background:var(--surface);border-radius:8px;border:1px solid transparent}
  .screen:hover,.screen.active{background:var(--surface-hover);border-color:var(--accent-border)}
  .screen-title{font-size:13.5px;font-weight:500;color:#f0fdfa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .screen-title mark{background:rgba(45,212,191,0.22);color:#ccfbf1;border-radius:2px;padding:0 1px}
  .screen-ctx{font-size:11px;color:var(--text-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .actions{display:flex;gap:6px;align-items:center}
  .act{font-size:11px;padding:5px 9px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--text-dim);cursor:pointer;white-space:nowrap;font-family:inherit}
  .act:hover{color:var(--tag-text);border-color:var(--accent-border);background:var(--accent-soft)}
  .act.primary{color:var(--tag-text);border-color:var(--accent-border);background:var(--accent-soft)}

  /* file rows */
  .file-row{display:grid;grid-template-columns:minmax(0,1fr) 160px 90px 40px;gap:12px;align-items:start;padding:12px 14px;background:var(--surface);border-radius:8px}
  .file-row:hover{background:var(--surface-hover)}
  .file-name{font-size:13px;font-weight:500;color:#f0fdfa;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .file-name:hover{color:var(--accent)}
  .file-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
  .tag{display:inline-block;padding:3px 8px;background:var(--accent-soft);border:1px solid var(--accent-border);border-radius:5px;font-size:11px;color:var(--tag-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .time{font-size:12px;color:rgba(255,255,255,0.4)}
  .staleness-dot{width:8px;height:8px;border-radius:50%;display:inline-block;opacity:0.85}

  .section-head{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);padding:16px 2px 6px}
  .none{padding:48px 0;text-align:center;color:var(--text-muted);font-size:13px}
  .empty{padding:72px 24px;text-align:center}
  .empty-icon{font-size:38px;margin-bottom:14px;opacity:0.3}
  .empty h2{font-size:15px;font-weight:500;color:rgba(255,255,255,0.6);margin-bottom:8px}
  .empty p{font-size:13px;color:var(--text-muted);max-width:460px;margin:0 auto;line-height:1.6}
  .empty code{background:rgba(255,255,255,0.06);padding:1px 5px;border-radius:4px;font-size:12px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#0f2b28;border:1px solid var(--accent-border);color:var(--tag-text);font-size:12px;padding:9px 16px;border-radius:8px;transition:transform .22s ease;pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0)}


  /* floating preview */
  .pv{position:fixed;right:22px;bottom:22px;width:430px;background:#0b1114;border:1px solid var(--accent-border);
      border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.6);z-index:50;
      opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .16s,transform .16s}
  .pv.on{opacity:1;transform:translateY(0);pointer-events:auto}
  .pv-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}
  .pv-t{font-size:12px;font-weight:600;color:#f0fdfa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .pv-s{font-size:10.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .pv-x{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;font-family:inherit}
  .pv-x:hover{color:var(--text)}
  .pv-body{position:relative;height:300px;background:#0e1518}
  .pv-body iframe{width:100%;height:100%;border:0;display:block}
  .pv-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
          padding:22px;font-size:11.5px;color:var(--text-muted);line-height:1.6}
  .pv-foot{padding:7px 12px;border-top:1px solid var(--border);font-size:10.5px;color:var(--text-muted)}
  .pv-toggle{padding:7px 11px;font-size:12px;border-radius:8px;border:1px solid var(--border);
             background:rgba(255,255,255,.04);color:var(--text-dim);cursor:pointer;font-family:inherit;white-space:nowrap}
  .pv-toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-border);color:var(--tag-text)}
  @media(max-width:760px){.pv{display:none}}
  @media(max-width:760px){
    .screen{grid-template-columns:minmax(0,1fr) auto}
    .screen>.mod-cell{display:none}
    .file-row{grid-template-columns:minmax(0,1fr) auto}
    .file-row>:nth-child(2),.file-row>:nth-child(4){display:none}
    .kbd{display:none}
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">ETS</div>
    <h1>ETS Figma Directory</h1>
    <span class="org">MoveInSync</span>
  </div>
  <div class="header-left">
    <span class="meta" id="metaInfo"></span>
    <a class="switch" href="../WIS/">WorkInSync &rarr;</a>
    <a class="switch" href="../">All directories</a>
  </div>
</div>

<div id="main"></div>
<div class="toast" id="toast">Link copied</div>

<script>
"use strict";

const STALE_COLORS = {fresh:"#10b981",recent:"#60a5fa",aging:"#f59e0b",stale:"#ef4444"};
const MAX_ROWS = 300;

const state = {
  files: [],
  screens: [],          // flattened label index
  pageNames: {},        // fileId -> {pageId: pageName}
  q: "",
  mode: "screens",      // "screens" | "files"
  module: "All",
  project: "All",
  sort: "lastModified-desc",
  cursor: -1,
  shown: []
};

/* ---------- load ---------- */
// The index ships as a gzipped blob rather than readable JSON: it keeps the file
// out of search-engine results and out of casual view in the repo. Falls back to
// plain JSON so an older data file still works.
async function fetchIndex(base) {
  const bust = "?v=" + Date.now();
  let res = await fetch(base + "figma-directory-data.bin" + bust);
  if (res.ok) {
    const buf = await res.arrayBuffer();
    if (typeof DecompressionStream !== "function")
      throw new Error("This browser is too old to read the index. Use a current Chrome, Edge, Firefox or Safari.");
    const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
    return JSON.parse(await new Response(stream).text());
  }
  res = await fetch(base + "figma-directory-data.json" + bust);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}


async function load() {
  try {
    state.files = await fetchIndex("");
  } catch (e) {
    return showEmpty(
      "Could not load the index",
      "<code>figma-directory-data.bin</code> must sit next to this page. " +
      "If the ETS directory hasn't been indexed yet, run the <b>Refresh Figma index</b> " +
      "workflow in the repo's Actions tab.<br><br><span style='opacity:.6'>" + esc(e.message) + "</span>"
    );
  }
  if (!Array.isArray(state.files) || !state.files.length) {
    return showEmpty(
      "No ETS files indexed yet",
      "Add Figma file links to <code>ets/figma-directory-config.json</code> and commit. " +
      "The indexer picks them up within a minute or two."
    );
  }
  buildScreenIndex();
  render();
}

function buildScreenIndex() {
  const screens = [];
  for (const f of state.files) {
    const pn = {};
    for (const p of (f.pagesData || [])) pn[p.id] = p.name;
    state.pageNames[f.id] = pn;
    for (const l of (f.labels || [])) {
      if (!l || !l.t) continue;
      screens.push({
        t: l.t,
        tl: l.t.toLowerCase(),
        nodeId: l.id,
        // what the preview should show: the section this heading titles, else its
        // page. The heading node itself is a few words of text and shows nothing.
        previewId: l.c || l.p || l.id,
        sectionName: l.cn || "",
        page: pn[l.p] || "",
        fileId: f.id,
        fileName: f.name || "",
        module: f.module || "Other",
        project: f.projectName || "",
        lastModified: f.lastModified || ""
      });
    }
  }
  state.screens = screens;
}

/* ---------- helpers ---------- */

function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function terms(q){return (q||"").toLowerCase().split(/\s+/).filter(Boolean);}
function matchesAll(h,ts){const s=(h||"").toLowerCase();return ts.every(t=>s.includes(t));}

function figmaUrl(fileId, nodeId, dev) {
  let u = "https://www.figma.com/design/" + fileId;
  if (nodeId) u += "?node-id=" + String(nodeId).replace(/:/g, "-");
  if (dev) u += (nodeId ? "&" : "?") + "m=dev";
  return u;
}

function timeAgo(d){
  if(!d) return "Unknown";
  const dt=new Date(d); if(isNaN(dt)) return d;
  const days=Math.floor((Date.now()-dt)/86400000);
  if(days<0) return "Future"; if(days===0) return "Today"; if(days===1) return "Yesterday";
  if(days<7) return days+"d ago"; if(days<30) return Math.floor(days/7)+"w ago";
  if(days<365) return Math.floor(days/30)+"mo ago"; return Math.floor(days/365)+"y ago";
}
function staleness(d){
  if(!d) return "stale";
  const dt=new Date(d); if(isNaN(dt)) return "stale";
  const days=Math.floor((Date.now()-dt)/86400000);
  if(days<30) return "fresh"; if(days<90) return "recent"; if(days<180) return "aging"; return "stale";
}

// Rank: whole-string match first, then prefix, then word-start, then anywhere.
// Shorter titles win ties, then more recently edited files.
function rank(s, ts) {
  let best = 4;
  for (const t of ts) {
    let r;
    if (s.tl === t) r = 0;
    else if (s.tl.startsWith(t)) r = 1;
    else if (new RegExp("\\b" + t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(s.tl)) r = 2;
    else r = 3;
    if (r < best) best = r;
  }
  return best;
}

function highlight(text, ts) {
  if (!ts.length) return esc(text);
  let out = esc(text);
  for (const t of ts) {
    const safe = t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    out = out.replace(new RegExp("(" + safe + ")(?![^<]*>)", "ig"), "<mark>$1</mark>");
  }
  return out;
}

function showEmpty(title, body) {
  document.getElementById("main").innerHTML =
    '<div class="empty"><div class="empty-icon">&#128269;</div><h2>' + title + '</h2><p>' + body + '</p></div>';
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
}

/* ---------- filtering ---------- */

function filteredScreens() {
  const ts = terms(state.q);
  let out = state.screens.filter(s =>
    (state.module === "All" || s.module === state.module) &&
    (state.project === "All" || s.project === state.project) &&
    (!ts.length || matchesAll(s.t + " " + s.page + " " + s.fileName, ts))
  );
  if (ts.length) {
    out = out.map(s => ({ s, r: rank(s, ts) }))
      .sort((a, b) =>
        a.r - b.r ||
        a.s.t.length - b.s.t.length ||
        new Date(b.s.lastModified || 0) - new Date(a.s.lastModified || 0))
      .map(x => x.s);
  } else {
    out = out.sort((a, b) => a.fileName.localeCompare(b.fileName) || a.t.localeCompare(b.t));
  }
  return out;
}

function filteredFiles() {
  const ts = terms(state.q);
  const [by, dir] = state.sort.split("-");
  return state.files.filter(f =>
    (state.module === "All" || f.module === state.module) &&
    (state.project === "All" || f.projectName === state.project) &&
    (!ts.length || matchesAll(f.searchText, ts) || matchesAll((f.module||"")+" "+(f.projectName||""), ts))
  ).sort((a, b) => {
    let c = 0;
    if (by === "lastModified") c = new Date(a.lastModified||0) - new Date(b.lastModified||0);
    else if (by === "name") c = (a.name||"").localeCompare(b.name||"");
    else if (by === "module") c = (a.module||"").localeCompare(b.module||"");
    return dir === "desc" ? -c : c;
  });
}

/* ---------- render ---------- */

function render() {
  const modules = [...new Set(state.files.map(f => f.module).filter(Boolean))].sort();
  const projects = [...new Set(state.files.map(f => f.projectName).filter(Boolean))].sort();

  let h = '<div class="controls">';
  h += '<div class="search-wrap"><span class="search-icon">&#128269;</span>' +
       '<input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search screens — e.g. cancel ride, roster upload, SOS" value="' + esc(state.q) + '">' +
       '<span class="kbd">⌘K</span></div>';
  h += '<div class="modes" role="tablist">' +
       '<button class="mode" role="tab" data-mode="screens" aria-selected="' + (state.mode==="screens") + '">Screens</button>' +
       '<button class="mode" role="tab" data-mode="files" aria-selected="' + (state.mode==="files") + '">Files</button></div>';

  h += '<button class="pv-toggle" id="pvToggle" aria-pressed="' + pvOn() + '" ' +
       'title="Show a live Figma preview of the hovered screen">Preview</button>';
  h += '<select id="moduleSel"><option value="All">All modules</option>';
  for (const m of modules) h += '<option value="'+esc(m)+'"'+(state.module===m?' selected':'')+'>'+esc(m)+'</option>';
  h += '</select>';
  h += '<select id="projectSel"><option value="All">All projects</option>';
  for (const p of projects) h += '<option value="'+esc(p)+'"'+(state.project===p?' selected':'')+'>'+esc(p)+'</option>';
  h += '</select>';
  if (state.mode === "files") {
    h += '<select id="sortSel">';
    for (const [v,l] of [["lastModified-desc","Latest first"],["lastModified-asc","Oldest first"],["name-asc","Name A→Z"],["module-asc","Module A→Z"]])
      h += '<option value="'+v+'"'+(state.sort===v?' selected':'')+'>'+l+'</option>';
    h += '</select>';
  }
  h += '</div>';

  h += '<div class="stats" id="stats"></div><div class="list" id="list"></div>';

  document.getElementById("main").innerHTML = h;
  document.getElementById("metaInfo").textContent =
    state.files.length + " files · " + state.screens.length.toLocaleString() + " screens";

  const q = document.getElementById("q");
  q.addEventListener("input", e => { state.q = e.target.value; state.cursor = -1; renderList(); });
  document.getElementById("moduleSel").addEventListener("change", e => { state.module = e.target.value; renderList(); });
  document.getElementById("projectSel").addEventListener("change", e => { state.project = e.target.value; renderList(); });
  const ss = document.getElementById("sortSel");
  if (ss) ss.addEventListener("change", e => { state.sort = e.target.value; renderList(); });
  const pvt = document.getElementById("pvToggle");
  if (pvt) pvt.addEventListener("click", () => {
    const next = !pvOn();
    pvSet(next);
    pvt.setAttribute("aria-pressed", String(next));
    if (!next) pvHide();
  });
  for (const b of document.querySelectorAll(".mode"))
    b.addEventListener("click", () => { state.mode = b.dataset.mode; state.cursor = -1; pvHide(); render(); });

  renderList();
  q.focus();
}

function renderList() {
  const list = document.getElementById("list");
  const stats = document.getElementById("stats");
  if (!list) return;

  if (state.mode === "screens") {
    const rows = filteredScreens();
    state.shown = rows.slice(0, MAX_ROWS);
    stats.innerHTML = '<span>' + rows.length.toLocaleString() + ' screen' + (rows.length===1?'':'s') +
      (rows.length > MAX_ROWS ? ' · showing first ' + MAX_ROWS : '') + '</span>' +
      '<span style="color:var(--text-muted)">↑↓ to move · Enter opens in Figma · ⇧Enter opens Dev Mode \u00b7 hover to preview</span>';

    if (!rows.length) { list.innerHTML = '<div class="none">No screens match. Try fewer words, or switch to Files.</div>'; return; }

    const ts = terms(state.q);
    let h = "";
    state.shown.forEach((s, i) => {
      h += '<div class="screen' + (i===state.cursor?' active':'') + '" data-i="' + i + '">';
      h += '<div style="min-width:0"><div class="screen-title">' + highlight(s.t, ts) + '</div>' +
           '<div class="screen-ctx">' + esc(s.fileName) + (s.page ? ' · ' + esc(s.page) : '') + '</div></div>';
      h += '<div class="mod-cell"><span class="tag">' + esc(s.module) + '</span></div>';
      h += '<div class="actions">' +
             '<button class="act primary" data-act="open" data-i="' + i + '">Open</button>' +
             '<button class="act" data-act="dev" data-i="' + i + '" title="Open in Figma Dev Mode">Dev</button>' +
             '<button class="act" data-act="copy" data-i="' + i + '" title="Copy link to this screen">Copy</button>' +
           '</div>';
      h += '</div>';
    });
    list.innerHTML = h;

  } else {
    const rows = filteredFiles();
    state.shown = rows;
    stats.innerHTML = '<span>' + rows.length + ' of ' + state.files.length + ' files</span>' +
      '<span><span class="dot" style="background:var(--fresh)"></span>Fresh &lt;30d</span>' +
      '<span><span class="dot" style="background:var(--recent)"></span>1–3mo</span>' +
      '<span><span class="dot" style="background:var(--aging)"></span>3–6mo</span>' +
      '<span><span class="dot" style="background:var(--stale)"></span>6mo+</span>';

    if (!rows.length) { list.innerHTML = '<div class="none">No files match.</div>'; return; }

    let h = "";
    for (const f of rows) {
      const cleanLink = (f.link || figmaUrl(f.id)).split("?")[0];
      h += '<div class="file-row">';
      h += '<div style="min-width:0"><a class="file-name" href="' + esc(cleanLink) + '" target="_blank" rel="noopener">' + esc(f.name) + '</a>' +
           '<div class="file-sub">' + esc(f.projectName || "Untagged") + ' · ' +
           (f.pages||[]).length + ' pages · ' + (f.labels||[]).length + ' screens</div></div>';
      h += '<div style="padding-top:2px"><span class="tag">' + esc(f.module || "Other") + '</span></div>';
      h += '<div class="time">' + timeAgo(f.lastModified) + '</div>';
      h += '<div style="display:flex;justify-content:flex-end;padding-top:4px"><span class="staleness-dot" style="background:' +
           STALE_COLORS[staleness(f.lastModified)] + '"></span></div>';
      h += '</div>';
    }
    list.innerHTML = h;
  }
}

/* ---------- floating preview ---------- */
// One reused panel showing a single Figma frame. The embed respects each viewer's
// own Figma permissions, so nothing here exposes a design to someone without access.
const PV_HOST = "mis-figma-directory";
let pvTimer = null, pvCur = -1, pvHideTimer = null;

function pvOn() {
  try { return localStorage.getItem("figdir.preview") !== "off"; } catch { return true; }
}
function pvSet(v) {
  try { localStorage.setItem("figdir.preview", v ? "on" : "off"); } catch {}
}

function pvEl() {
  let el = document.getElementById("pv");
  if (el) return el;
  el = document.createElement("div");
  el.id = "pv";
  el.className = "pv";
  el.innerHTML =
    '<div class="pv-head"><div style="min-width:0;flex:1">' +
      '<div class="pv-t" id="pvT"></div><div class="pv-s" id="pvS"></div>' +
    '</div><button class="pv-x" id="pvX" title="Hide preview">×</button></div>' +
    '<div class="pv-body" id="pvB"></div>' +
    '<div class="pv-foot">Live from Figma · sign in to Figma if it stays blank</div>';
  document.body.appendChild(el);
  el.addEventListener("mouseenter", () => clearTimeout(pvHideTimer));
  el.addEventListener("mouseleave", pvHide);
  el.querySelector("#pvX").addEventListener("click", () => { pvSet(false); pvHide(); renderList(); });
  return el;
}

function pvHide() {
  clearTimeout(pvTimer);
  pvHideTimer = setTimeout(() => {
    const el = document.getElementById("pv");
    if (el) { el.classList.remove("on"); el.querySelector("#pvB").innerHTML = ""; }
    pvCur = -1;
  }, 180);
}

function pvShow(i) {
  if (!pvOn()) return;
  const s = state.shown[i];
  if (!s || state.mode !== "screens") return;
  clearTimeout(pvHideTimer);
  if (pvCur === i) return;
  pvCur = i;

  const el = pvEl();
  el.querySelector("#pvT").textContent = s.t;
  el.querySelector("#pvS").textContent =
    (s.sectionName ? s.sectionName + " · " : "") + s.fileName + (s.page ? " · " + s.page : "");
  const body = el.querySelector("#pvB");
  body.innerHTML = '<div class="pv-msg">Loading the frame from Figma…</div>';
  el.classList.add("on");

  const target = s.previewId || s.nodeId;
  if (!target) { body.innerHTML = '<div class="pv-msg">No frame id on this screen — re-index the file.</div>'; return; }

  // A fresh iframe each time: swapping src on one pollutes browser history.
  const f = document.createElement("iframe");
  f.loading = "lazy";
  f.allowFullscreen = true;
  f.referrerPolicy = "no-referrer-when-downgrade";
  f.src = "https://embed.figma.com/design/" + s.fileId +
          "?node-id=" + String(target).replace(/:/g, "-") +
          "&embed-host=" + PV_HOST + "&theme=dark&footer=false&page-selector=false";
  f.addEventListener("load", () => { const m = body.querySelector(".pv-msg"); if (m) m.remove(); });
  body.appendChild(f);
}

function pvQueue(i) {
  if (!pvOn()) return;
  clearTimeout(pvTimer);
  pvTimer = setTimeout(() => pvShow(i), 420);   // don't fire while skimming
}

/* ---------- interaction ---------- */

function openScreen(i, dev) {
  const s = state.shown[i];
  if (!s) return;
  if (!s.nodeId) { toast("No node id on this screen — re-index the file"); return; }
  window.open(figmaUrl(s.fileId, s.nodeId, dev), "_blank", "noopener");
}

async function copyScreen(i) {
  const s = state.shown[i];
  if (!s) return;
  const url = figmaUrl(s.fileId, s.nodeId, false);
  try { await navigator.clipboard.writeText(url); toast("Link copied"); }
  catch { window.prompt("Copy this link:", url); }
}

document.addEventListener("mouseover", e => {
  const row = e.target.closest(".screen");
  if (row) pvQueue(Number(row.dataset.i));
});
document.addEventListener("mouseout", e => {
  const row = e.target.closest(".screen");
  if (row && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".screen, .pv"))) pvHide();
});

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-act]");
  if (btn) {
    const i = Number(btn.dataset.i);
    if (btn.dataset.act === "open") openScreen(i, false);
    else if (btn.dataset.act === "dev") openScreen(i, true);
    else if (btn.dataset.act === "copy") copyScreen(i);
    return;
  }
  const row = e.target.closest(".screen");
  if (row) openScreen(Number(row.dataset.i), false);
});

document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    const q = document.getElementById("q");
    if (q) { q.focus(); q.select(); }
    return;
  }
  if (state.mode !== "screens") return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const max = state.shown.length - 1;
    if (max < 0) return;
    state.cursor = e.key === "ArrowDown"
      ? Math.min(max, state.cursor + 1)
      : Math.max(0, state.cursor - 1);
    renderList();
    document.querySelector('.screen[data-i="' + state.cursor + '"]')?.scrollIntoView({block:"nearest"});
    pvQueue(state.cursor);
  } else if (e.key === "Enter" && state.cursor >= 0) {
    e.preventDefault();
    openScreen(state.cursor, e.shiftKey);
  } else if (e.key === "Escape") {
    const q = document.getElementById("q");
    if (q && q.value) { q.value = ""; state.q = ""; state.cursor = -1; renderList(); }
  }
});

load();
</script>
</body>
</html>
